<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play TEWGO</title>
<meta name="description" content="Play TEWGO free in your browser. Five in a row wins, and so does capturing five pairs.">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#05051a">
<style>
  :root {
    --bg: #0a0a14;
    --gold: #ffd60a;
    --blue: #4fa3ff;
    --text: #f2f2f7;
    --muted: #9a9ab0;
    --card: rgba(255,255,255,0.05);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100dvh;
    padding: 12px 12px 24px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  /* Space scene: painted by play/space.js on a full-viewport canvas
     (layered nebula glows, starfield, ringed planet - the iOS Nebula look) */
  #scene {
    position: fixed; inset: 0; z-index: -1;
    width: 100%; height: 100%;
    background: var(--bg);
  }
  header { text-align: center; padding: 4px 0 10px; }
  .logo {
    font-size: 28px; font-weight: 900; letter-spacing: 2px;
    color: var(--text); text-decoration: none; display: inline-block;
    text-shadow: 0 0 24px rgba(255,214,10,0.25);
  }
  .logo .go { color: var(--gold); }
  .beta {
    vertical-align: super; font-size: 10px; font-weight: 700; letter-spacing: 1px;
    color: var(--gold); background: #ffd60a1a; border-radius: 999px; padding: 2px 8px; margin-left: 6px;
  }
  :root { --board-size: min(94vw, 72dvh, 640px); }
  .hud {
    width: var(--board-size);
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 8px; font-size: 14px;
  }
  .pill {
    background: var(--card); border: 1px solid #ffffff14; border-radius: 999px;
    padding: 6px 14px; white-space: nowrap;
  }
  .pill b { font-variant-numeric: tabular-nums; }
  .you b { color: var(--gold); }
  .ai b { color: var(--blue); }
  #status { color: var(--muted); text-align: center; flex: 1; min-width: 0; }
  .board-wrap {
    position: relative;
    width: var(--board-size);
    background:
      radial-gradient(ellipse 90% 70% at 50% 0%, rgba(79, 163, 255, 0.07), transparent 70%),
      rgba(8, 9, 24, 0.62);
    border: 1px solid #ffffff1f; border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5), inset 0 0 60px rgba(28, 28, 74, 0.45);
    backdrop-filter: blur(2px);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: auto; }
  #board { touch-action: none; }
  .controls {
    width: var(--board-size);
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-top: 12px; flex-wrap: wrap;
  }
  select, button {
    font: inherit; color: var(--text);
    background: var(--card); border: 1px solid #ffffff2a; border-radius: 12px;
    padding: 10px 16px; cursor: pointer;
  }
  select:focus, button:focus { outline: 1px solid var(--gold); }
  #newGame { font-weight: 700; }
  .toggle { font-size: 18px; padding: 8px 12px; }
  .toggle.off { opacity: 0.35; }
  .overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(5,5,26,0.82); backdrop-filter: blur(2px);
    border-radius: 16px; padding: 24px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { font-size: 32px; margin-bottom: 6px; }
  .overlay p { color: var(--muted); margin-bottom: 20px; }
  .btn-gold {
    background: var(--gold); color: #000; font-weight: 700; border: none;
    padding: 12px 26px; border-radius: 14px;
  }
  .btn-ghost {
    background: transparent; border: 1px solid #ffffff40; color: var(--text);
    font-weight: 700; padding: 12px 26px; border-radius: 14px;
  }
  .overlay-buttons { display: flex; gap: 12px; justify-content: center; }

  /* Match intro: contenders slide in around a VS mark, auto-dismisses */
  .intro {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.78);
  }
  .intro.show { display: flex; }
  .intro-inner { text-align: center; transition: opacity 0.3s ease, transform 0.3s ease; }
  .intro.leaving .intro-inner { opacity: 0; transform: scale(1.06); }
  .intro-caption { font-size: 13px; font-weight: 700; letter-spacing: 3px; color: rgba(255,255,255,0.55); }
  .intro-row { display: flex; gap: 20px; align-items: center; justify-content: center; margin-top: 26px; }
  .contender {
    transition: transform 0.55s cubic-bezier(0.2, 1.25, 0.35, 1);
  }
  .contender.left { transform: translateX(-260px); }
  .contender.right { transform: translateX(260px); }
  .intro.appear .contender { transform: translateX(0); }
  .contender-card {
    padding: 16px; border-radius: 18px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
  }
  .intro-piece { width: 92px; height: 92px; display: block; }

  /* Piece picker */
  .picker-cols { display: flex; gap: 28px; justify-content: center; margin: 14px 0 20px; }
  .picker-title {
    font-size: 13px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
  }
  .piece-option {
    display: flex; align-items: center; gap: 10px; width: 150px;
    padding: 6px 10px; margin-top: 8px; border-radius: 12px;
    border: 1px solid #ffffff20; background: var(--card);
    color: var(--text); font: inherit; cursor: pointer;
  }
  .piece-option.selected { border-color: var(--gold); color: var(--gold); font-weight: 700; }
  .piece-option canvas { width: 34px; height: 44px; }
  .contender-name { margin-top: 10px; font-weight: 700; font-size: 15px; }
  .vs {
    font-size: 34px; font-weight: 900; color: var(--gold);
    transform: scale(0.2); opacity: 0;
    transition: transform 0.55s cubic-bezier(0.2, 1.25, 0.35, 1), opacity 0.4s ease;
  }
  .intro.appear .vs { transform: scale(1); opacity: 1; }
  footer { margin-top: 18px; font-size: 13px; color: var(--muted); text-align: center; }
  footer a { color: var(--text); }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<header>
  <a class="logo" href="/">TEW<span class="go">GO</span><span class="beta">Beta</span></a>
</header>

<div class="hud">
  <span class="pill you"><span id="youLabel">You</span> <b id="youPairs">0</b>/5</span>
  <span id="status">Your move</span>
  <span class="pill ai"><span id="aiLabel">AI</span> <b id="aiPairs">0</b>/5</span>
</div>

<div class="board-wrap">
  <canvas id="board"></canvas>
  <div class="overlay" id="overlay">
    <div>
      <h2 id="overlayTitle"></h2>
      <p id="overlayReason"></p>
      <div class="overlay-buttons">
        <button class="btn-gold" id="playAgain">Play again</button>
        <button class="btn-ghost" id="shareBtn">Share</button>
      </div>
    </div>
  </div>
  <div class="overlay" id="piecePicker">
    <div>
      <h2 style="font-size:24px">Pieces</h2>
      <div class="picker-cols">
        <div><h3 class="picker-title" id="pickerTitle1"></h3><div id="pickerCol1"></div></div>
        <div><h3 class="picker-title" id="pickerTitle2"></h3><div id="pickerCol2"></div></div>
      </div>
      <button class="btn-gold" id="pickerDone">Done</button>
    </div>
  </div>
</div>

<div class="controls">
  <label>
    Mode
    <select id="mode">
      <option value="ai" selected>vs AI</option>
      <option value="2p">2 players</option>
    </select>
  </label>
  <label id="difficultyLabel">
    AI level
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
  </label>
  <span>
    <button class="toggle" id="pieceBtn" title="Pieces">👥</button>
    <button class="toggle" id="soundToggle" title="Sound effects">🔊</button>
    <button class="toggle" id="musicToggle" title="Music">🎵</button>
  </span>
  <button id="newGame">New game</button>
</div>

<footer>
  <p>Five in a row wins. Capturing five pairs also wins. Flank two enemy pieces to capture them.</p>
  <p style="margin-top:10px"><button class="btn-ghost" id="installBtn" style="display:none; font-size:14px; padding:8px 18px;">📲 Install as app</button></p>
  <p style="margin-top:6px">Prefer the full experience? <a href="/">Get TEWGO on the App Store</a></p>
</footer>

<div class="intro" id="intro">
  <div class="intro-inner">
    <div class="intro-caption">SPACE</div>
    <div class="intro-row">
      <div class="contender left">
        <div class="contender-card"><canvas class="intro-piece" id="introP1Piece" width="184" height="184"></canvas></div>
        <div class="contender-name" id="introP1Name">You</div>
      </div>
      <div class="vs">VS</div>
      <div class="contender right">
        <div class="contender-card"><canvas class="intro-piece" id="introP2Piece" width="184" height="184"></canvas></div>
        <div class="contender-name" id="introAiName">AI</div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
